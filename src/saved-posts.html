<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' blob:; media-src 'self' blob:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="saved-posts.css">
  <title>Saved Posts — Nor1c Suite</title>
</head>
<body>
  <main class="page">
    <aside class="folders-sidebar">
      <nav id="folders-bar" class="folders-bar" aria-label="Saved post folders">
        <button class="folder-chip is-active" type="button" data-folder-id="">
          <span class="folder-chip-name">All posts</span>
          <span class="folder-chip-count">0</span>
        </button>
        <button id="new-folder-btn" class="folder-add" type="button" title="Create folder" aria-label="Create folder">+</button>
      </nav>
    </aside>
    <div class="saved-posts-content">
      <header class="page-header">
      <div>
        <h1>Saved Posts</h1>
        <p>Stored in this browser extension</p>
      </div>
      <button id="refresh-btn" class="icon-button" type="button" title="Refresh saved posts" aria-label="Refresh saved posts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 11.7-2L20 12M4 12l2.8 5a7 7 0 0 0 11.7-2"/></svg>
      </button>
    </header>
    <p id="page-error" class="page-error" role="alert"></p>
    <p id="empty-state" class="empty-state" hidden>No saved posts yet.</p>
      <section id="posts-list" class="posts-list" aria-label="Saved posts"></section>
      <nav id="pagination" class="pagination" aria-label="Saved posts pagination" hidden>
        <button id="pagination-prev" class="pagination-button" type="button">Previous</button>
        <span id="pagination-status" class="pagination-status" aria-live="polite">Page 1 of 1</span>
        <button id="pagination-next" class="pagination-button" type="button">Next</button>
      </nav>
    </div>
  </main>
  <dialog id="folder-manager" class="folder-manager" aria-labelledby="folder-manager-title">
    <form method="dialog" class="folder-manager-panel">
      <h2 id="folder-manager-title">Organize post</h2>
      <p>Select one or more folders for this saved post.</p>
      <div id="folder-manager-list" class="folder-manager-list"></div>
      <div class="folder-manager-actions">
        <button id="folder-manager-cancel" class="dialog-button" type="button">Cancel</button>
        <button id="folder-manager-save" class="dialog-button dialog-button-primary" type="button">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="image-viewer" class="image-viewer" aria-label="Saved media preview">
    <button id="image-viewer-close" class="icon-button image-viewer-close" type="button" title="Close media viewer" aria-label="Close media viewer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
    <button id="image-viewer-prev" class="viewer-nav viewer-nav-prev" type="button" hidden title="Previous saved post" aria-label="Previous saved post"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div id="image-viewer-media" class="image-viewer-media"></div>
    <button id="image-viewer-next" class="viewer-nav viewer-nav-next" type="button" hidden title="Next saved post" aria-label="Next saved post"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  </dialog>
  <script src="lib/saved-posts-store.js"></script>
  <script src="saved-posts.js"></script>
</body>
</html>
